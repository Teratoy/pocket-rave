[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="humans/*.json"
exclude_filter=""
export_path="build/pocketrave-debug.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.toyfactory.pocketrave"
package/name="PocketRave"
package/signed=true
screen/immersive_mode=true
launcher_icons/main_192x192="res://icons/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://icons/icon_adaptive_fg.png"
launcher_icons/adaptive_background_432x432="res://icons/icon_adaptive_bg.png"

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="humans/*.json"
exclude_filter=""
export_path="build/web/index.html"

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
